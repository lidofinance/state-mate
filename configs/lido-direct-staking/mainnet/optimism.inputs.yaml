  # CCIP router (Optimism): https://docs.chain.link/ccip/directory/mainnet/chain/ethereum-mainnet-optimism-1
  - &l2CcipRouter "0x3206695CaE29952f4b0c22a169725a865bc8Ce0f"
  # LINK: https://docs.chain.link/resources/link-token-contracts
  - &l2LinkToken "0x350a791Bfc2C21F9Ed5d10980Dad2e2638ffa7f6"
  # PriceOracle.AGGREGATOR — Chainlink wstETH/stETH Exchange Rate: https://data.chain.link/feeds/optimism/mainnet/wsteth-steth%20exchangerate
