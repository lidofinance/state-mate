# Direct Staking optimism parameters and external references.
# Source layout: lidofinance/l2-direct-staking config/state; see ../README.md.
# Automation ownership and CRE author match the Direct Staking source configs.
config:
  - &syncDelay 43200 # 12h
  - &executorGracePeriod 86400 # 24h
  - &oracleHeartbeat 86400 # 24h staleness bound
  - &minProcessMessageGas 75000 # CustomSender.MIN_PROCESS_MESSAGE_GAS
  - &syncMinAmount "5000000000000000000" # 5e18
  - &syncMaxAmount "100000000000000000000" # 100e18
  - &maxGasLimit 7000000 # SyncTrigger.getMaxGasLimit() — Optimism EVM2EVMOnRamp (v1.5) maxPerMsgGasLimit
  # feeOtoD = FeeCodec.encodeCCIP(maxFee=0.125e18, payInLink=false, gasLimit=1_000_000)
  - &feeOtoD "0x000000000000000001bc16d674ec800000000f4240"
  # feeDtoO = FeeCodec.encodeOptimismL1toL2(originL2Gas=100_000) — OP-stack feeAmount is always 0
  - &feeDtoO "0x0000000000000000000000000000000000000186a0"
  - &maxNativeFee "125000000000000000" # getMaxFees() = maxFee + DtoO(0) = 0.125e18

externals:
  # OP-stack predeploys: https://specs.optimism.io/protocol/predeploys.html
  - &l2Weth "0x4200000000000000000000000000000000000006"
  - &ovmL2CrossDomainMessenger "0x4200000000000000000000000000000000000007"
  # https://docs.lido.fi/deployed-contracts
