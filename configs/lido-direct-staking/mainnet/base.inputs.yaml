# Direct Staking Base parameters and external references.
# Follows the common.inputs.yaml + base.inputs.yaml layout in lidofinance/l2-direct-staking.
# Automation ownership and CRE author match the Direct Staking source configs.
config:
  - &syncDelay 43200 # 12h
  - &executorGracePeriod 86400 # 24h
  - &oracleHeartbeat 86400 # 24h staleness bound
  - &minProcessMessageGas 75000 # CustomSender.MIN_PROCESS_MESSAGE_GAS
  - &syncMinAmount "5000000000000000000" # 5e18
  - &syncMaxAmount "100000000000000000000" # 100e18
  - &maxGasLimit 7000000 # SyncTrigger.getMaxGasLimit() — Base FeeQuoter maxPerMsgGasLimit
  # FeeCodec.encodeCCIP(maxFee=0.125e18, payInLink=false, gasLimit=1_000_000)
  - &feeOtoD "0x000000000000000001bc16d674ec800000000f4240"
  # FeeCodec.encodeBaseL1toL2(originL2Gas=100_000) — OP-stack feeAmount is always 0
  - &feeDtoO "0x0000000000000000000000000000000000000186a0"
  - &maxNativeFee "125000000000000000" # getMaxFees() = maxFee + DtoO(0) = 0.125e18

externals:
  # OP-stack predeploys: https://specs.optimism.io/protocol/predeploys.html
  - &l2Weth "0x4200000000000000000000000000000000000006"
  - &ovmL2CrossDomainMessenger "0x4200000000000000000000000000000000000007"
  # https://docs.lido.fi/deployed-contracts
  - &lidoDaoAgent "0x3e40D73EB977Dc6a537aF587D48316feE66E9C8c"
  - &l2Wsteth "0xc1CBa3fCea344f92D9239c08C0568f6F2F0ee452"
  - &lolMsig "0xFc832dA3D688352C0aB1A32136c7fABbB16d66E6" # LOL multisig
  # CCIP router (Base): https://docs.chain.link/ccip/directory/mainnet/chain/ethereum-mainnet-base-1
  - &l2CcipRouter "0x881e3A65B4d4a04dD529061dd0071cf975F58bCD"
  # LINK: https://docs.chain.link/resources/link-token-contracts
  - &l2LinkToken "0x88Fb150BDc53A65fe94Dea0c9BA0a6dAf8C6e196"
  # PriceOracle.AGGREGATOR — https://data.chain.link/feeds/base/mainnet/wsteth-steth%20exchangerate
  - &l2WstethOracleAggregator "0xB88BAc61a4Ca37C43a3725912B1f472c9A5bc061"
  # CRE KeystoneForwarder: https://docs.chain.link/cre/guides/workflow/using-evm-client/forwarder-directory-ts
