# yaml-language-server: $schema=../../../schemas/main-schema.json
parameters:
  - &trustedCaller "0xeBe5948787Bb3a565F67ccD93cb85A91960c472a"
  - &INITIAL_VALIDATOR_EXIT_FEE_LIMIT "100000000000000000"
  - &MAX_GROUP_SHARE_LIMIT "500000000000000000000000"
  - &MAX_DEFAULT_TIER_SHARE_LIMIT "500000000000000000000000"

misc:
  - &DEFAULT_TIER_OPERATOR "0xFFfFfFffFFfffFFfFFfFFFFFffFFFffffFfFFFfF"
  - &locator "0xe2EF9536DAAAEBFf5b1c130957AB3E80056b06D8"
  - &evmScriptExecutor "0x79a20FD0FA36453B2F45eAbab19bfef43575Ba9E"
  - &withdrawalRequestPredeployAddress "0x00000961Ef480Eb55e80D19ad83579A64c007002"
  - &MAX_INFRA_FEE_BP "100" # 1%
  - &MAX_LIQUIDITY_FEE_BP "1000" # 10%
  - &MAX_RESERVATION_FEE_BP "0" # 0%

deployed:
  l1:
    - &registerGroupsInOperatorGrid "0x50ffc44FF526405dBA3e5a4833B003D93301dDDd"
    - &updateGroupsShareLimitInOperatorGrid "0x56Ff87F41a8CF795764E15E496124240Ac17695b"
    - &registerTiersInOperatorGrid "0x8182E168f858514328C06b5C21eec975E105D494"
    - &alterTiersInOperatorGrid "0x9A3Fe18BcD5e7657f6a78Ab895aF125Cacae2c36"
    - &vaultsAdapter "0x854CF0D7446Faa7AdDFE557cc8aa9FA9b7017910"
    - &setJailStatusInOperatorGrid "0x395E6AF61B6Ba3EC0E72E168A2Ec8204589F357c"
    - &updateVaultsFeesInOperatorGrid "0x2D5b8B082d618A8d5DeFE3f4c2b2869e3f1C1a3D"
    - &forceValidatorExitsInVaultHub "0x820e9924C2059d37871acd6eccB578e4a3B15c30"
    - &socializeBadDebtInVaultHub "0x01C9dB53D7a87c3e47D537c925921fB735bEe6c9"
    - &setLiabilitySharesTargetInVaultHub "0xc5dCd2A9642ceA9B71A632BF5b8ff52424Ea1B40"

l1:
  rpcUrl: ETH_HOODI_RPC_URL
  explorerHostname: api.etherscan.io
  explorerTokenEnv: ETHERSCAN_TOKEN
  chainId: 560048
  contracts:
    RegisterGroupsInOperatorGrid:
      name: RegisterGroupsInOperatorGrid
      address: *registerGroupsInOperatorGrid
      checks:
        DEFAULT_TIER_OPERATOR: *DEFAULT_TIER_OPERATOR
        createEVMScript: null
        decodeEVMScriptCallData: null
        lidoLocator: *locator
        maxShareLimit: *MAX_GROUP_SHARE_LIMIT
        trustedCaller: *trustedCaller

    UpdateGroupsShareLimitInOperatorGrid:
      name: UpdateGroupsShareLimitInOperatorGrid
      address: *updateGroupsShareLimitInOperatorGrid
      checks:
        createEVMScript: null
        decodeEVMScriptCallData: null
        lidoLocator: *locator
        maxShareLimit: *MAX_GROUP_SHARE_LIMIT
        trustedCaller: *trustedCaller

    RegisterTiersInOperatorGrid:
      name: RegisterTiersInOperatorGrid
      address: *registerTiersInOperatorGrid
      checks:
        DEFAULT_TIER_OPERATOR: *DEFAULT_TIER_OPERATOR
        createEVMScript: null
        decodeEVMScriptCallData: null
        lidoLocator: *locator
        trustedCaller: *trustedCaller

    AlterTiersInOperatorGrid:
      name: AlterTiersInOperatorGrid
      address: *alterTiersInOperatorGrid
      checks:
        createEVMScript: null
        decodeEVMScriptCallData: null
        defaultTierMaxShareLimit: *MAX_DEFAULT_TIER_SHARE_LIMIT
        lidoLocator: *locator
        trustedCaller: *trustedCaller

    VaultsAdapter:
      name: VaultsAdapter
      address: *vaultsAdapter
      checks:
        WITHDRAWAL_REQUEST_PREDEPLOY_ADDRESS: *withdrawalRequestPredeployAddress
        evmScriptExecutor: *evmScriptExecutor
        lidoLocator: *locator
        trustedCaller: *trustedCaller
        validatorExitFeeLimit: *INITIAL_VALIDATOR_EXIT_FEE_LIMIT

    SetJailStatusInOperatorGrid:
      name: SetJailStatusInOperatorGrid
      address: *setJailStatusInOperatorGrid
      checks:
        createEVMScript: null
        decodeEVMScriptCallData: null
        trustedCaller: *trustedCaller
        vaultsAdapter: *vaultsAdapter

    UpdateVaultsFeesInOperatorGrid:
      name: UpdateVaultsFeesInOperatorGrid
      address: *updateVaultsFeesInOperatorGrid
      checks:
        createEVMScript: null
        decodeEVMScriptCallData: null
        lidoLocator: *locator
        trustedCaller: *trustedCaller
        vaultsAdapter: *vaultsAdapter
        maxInfraFeeBP: *MAX_INFRA_FEE_BP
        maxLiquidityFeeBP: *MAX_LIQUIDITY_FEE_BP
        maxReservationFeeBP: *MAX_RESERVATION_FEE_BP

    ForceValidatorExitsInVaultHub:
      name: ForceValidatorExitsInVaultHub
      address: *forceValidatorExitsInVaultHub
      checks:
        WITHDRAWAL_REQUEST_PREDEPLOY_ADDRESS: *withdrawalRequestPredeployAddress
        createEVMScript: null
        decodeEVMScriptCallData: null
        trustedCaller: *trustedCaller
        vaultsAdapter: *vaultsAdapter

    SocializeBadDebtInVaultHub:
      name: SocializeBadDebtInVaultHub
      address: *socializeBadDebtInVaultHub
      checks:
        createEVMScript: null
        decodeEVMScriptCallData: null
        trustedCaller: *trustedCaller
        vaultsAdapter: *vaultsAdapter

    # TODO: need to be updated before use
    SetLiabilitySharesTargetInVaultHub:
      name: SetLiabilitySharesTargetInVaultHub
      address: *setLiabilitySharesTargetInVaultHub
      checks:
        createEVMScript: null
        decodeEVMScriptCallData: null
        trustedCaller: *trustedCaller
        vaultsAdapter: "0xBC2bb8310730F3D2b514Cb26f7e0A8776De879Ac"
