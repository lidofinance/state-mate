name: Configuration Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: configs/lido/mainnet
          - config: configs/lido/testnet
          - config: configs/lido-direct-staking/mainnet
          - config: configs/lido-earn/mainnet
          - config: configs/lido-multichain/mainnet
          - config: configs/lido-multichain/testnet
          - config: configs/mellow/mainnet
          - config: configs/defiwrapper/mainnet
          - config: configs/hypernative-guard/mainnet

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # A missing secret is an empty string, so `||` falls back to the .env.sample default;
      # keep the two in sync. The nightly run rebuilds every ABI from the explorer, so a store
      # that drifted from the canonical source fails the job instead of being silently trusted
      - name: Run state-mate
        env:
          ETHERSCAN_TOKEN: ${{ secrets.ETHERSCAN_TOKEN }}
          ETH_RPC_URL: ${{ secrets.MAINNET_REMOTE_RPC_URL || 'https://eth.drpc.org' }}
          ETH_HOODI_RPC_URL: ${{ secrets.HOODI_REMOTE_RPC_URL || 'https://hoodi.drpc.org' }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL || 'https://arbitrum.drpc.org' }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://base.drpc.org' }}
          MANTLE_RPC_URL: ${{ secrets.MANTLE_RPC_URL || 'https://mantle.drpc.org' }}
          PLASMA_RPC_URL: ${{ secrets.PLASMA_RPC_URL || 'https://plasma.drpc.org' }}
        run: yarn start ${{ matrix.config }} --quiet ${{ github.event_name == 'schedule' && '--update-abi' || '' }}

      - name: Check ABI provenance
        if: github.event_name == 'schedule'
        run: |
          if ! git diff --exit-code -- ${{ matrix.config }}; then
            echo "Error: the committed ABI store differs from what the explorer serves."
            exit 1
          fi

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test:coverage

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # biome lints and formats the TypeScript and JSON; prettier keeps the YAML and Markdown
      - name: Run linter
        run: yarn lint

      - name: Check formatting
        run: yarn format

      # biome has no type-aware rules, so types need their own gate
      - name: Typecheck
        run: yarn typecheck

  schemas:
    name: Validate Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Generate schemas
        run: yarn schemas

      - name: Check if schemas are up to date
        run: |
          if ! git diff --exit-code schemas/; then
            echo "Error: Schema files are not up to date. Please run 'yarn schemas' and commit the changes."
            exit 1
          fi
