name: Configuration Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: configs/lido/mainnet
          - config: configs/lido/testnet
          - config: configs/lido-earn/mainnet
          - config: configs/lido-multichain/mainnet
          - config: configs/lido-multichain/testnet
          - config: configs/mellow/mainnet
          - config: configs/defiwrapper/mainnet
          - config: configs/hypernative-guard/mainnet

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Secrets are appended to .env instead of exported through `env:`: a missing secret exports
      # an empty variable, and dotenv never overrides an existing one, even empty, so the
      # .env.sample default would be lost. Within .env the last line wins.
      - name: Prepare .env
        env:
          ETHERSCAN_TOKEN: ${{ secrets.ETHERSCAN_TOKEN }}
          ETH_RPC_URL: ${{ secrets.MAINNET_REMOTE_RPC_URL }}
          ETH_HOODI_RPC_URL: ${{ secrets.HOODI_REMOTE_RPC_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          MANTLE_RPC_URL: ${{ secrets.MANTLE_RPC_URL }}
          PLASMA_RPC_URL: ${{ secrets.PLASMA_RPC_URL }}
        run: |
          cp .env.sample .env
          for name in ETHERSCAN_TOKEN ETH_RPC_URL ETH_HOODI_RPC_URL ARBITRUM_RPC_URL BASE_RPC_URL MANTLE_RPC_URL PLASMA_RPC_URL; do
            value=$(printenv "$name" || true)
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> .env
            fi
          done

      - name: Run state-mate
        run: yarn start ${{ matrix.config }} --quiet

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test:coverage

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # biome lints and formats the TypeScript and JSON; prettier keeps the YAML and Markdown
      - name: Run linter
        run: yarn lint

      - name: Check formatting
        run: yarn format

      # biome has no type-aware rules, so types need their own gate
      - name: Typecheck
        run: yarn typecheck

  schemas:
    name: Validate Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Generate schemas
        run: yarn schemas

      - name: Check if schemas are up to date
        run: |
          if ! git diff --exit-code schemas/; then
            echo "Error: Schema files are not up to date. Please run 'yarn schemas' and commit the changes."
            exit 1
          fi
